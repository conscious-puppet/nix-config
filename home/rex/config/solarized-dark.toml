# Solarized Dark, matching wezterm's "Solarized (dark) (terminal.sexy)" scheme.
#
# Import it once with:
#   rex do client.theme.import path=$HOME/.config/rex/solarized-dark.toml
# Add `-C <label>` when more than one Rex app is connected.
#
# The app names the theme after this file, and gives it an ID that is new on
# every Mac. settings.lua therefore names the theme instead of identifying it,
# and theme.lua resolves that name to this Mac's ID from the app's preferences,
# so the same configuration selects it on every Mac after the import.
#
# Selection uses the same highlight as the Neovim theme's Visual override
# (fg base03 on bg yellow) instead of Solarized's base02-on-base03, which is
# almost invisible against the background.

palette = 0=#002b36
palette = 1=#dc322f
palette = 2=#859900
palette = 3=#b58900
palette = 4=#268bd2
palette = 5=#6c71c4
palette = 6=#2aa198
palette = 7=#93a1a1
palette = 8=#657b83
palette = 9=#dc322f
palette = 10=#859900
palette = 11=#b58900
palette = 12=#268bd2
palette = 13=#6c71c4
palette = 14=#2aa198
palette = 15=#fdf6e3
